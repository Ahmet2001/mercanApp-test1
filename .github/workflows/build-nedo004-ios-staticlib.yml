name: Build Exact Nedo004 iOS Staticlib

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-nedo004-ios-staticlib.yml'

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Fetch exact NDSRF004 vocab from final model snapshot
        shell: bash
        run: |
          set -euxo pipefail
          git lfs install
          mkdir -p tmp
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 \
            https://huggingface.co/Ethosoft/NedoLM-0.8B-SFT-6478-GGUF \
            tmp/model
          cd tmp/model
          git lfs ls-files
          VOCAB_PATH="$(git lfs ls-files -n | grep 'surface-vocab' | head -n 1)"
          test -n "$VOCAB_PATH"
          git lfs pull --include="$VOCAB_PATH" --exclude=""
          test -s "$VOCAB_PATH"
          ACTUAL="$(shasum -a 256 "$VOCAB_PATH" | awk '{print $1}')"
          echo "Exact NDSRF004 vocab: $VOCAB_PATH"
          echo "SHA256: $ACTUAL"
          test "$ACTUAL" = "72412d981dac65a29d1767bc98821fc2bcffc2de53c534e7c719598515bfb600"
          echo "VOCAB_PATH=$VOCAB_PATH" >> "$GITHUB_ENV"

      - name: Fetch tokenizer source and install exact vocab
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf runtime/NedoTokenizer
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 \
            https://huggingface.co/Ethosoft/NedoTokenizer \
            runtime/NedoTokenizer
          mkdir -p runtime/NedoTokenizer/assets
          cp "tmp/model/$VOCAB_PATH" runtime/NedoTokenizer/assets/surface-vocab.bin
          ACTUAL="$(shasum -a 256 runtime/NedoTokenizer/assets/surface-vocab.bin | awk '{print $1}')"
          test "$ACTUAL" = "72412d981dac65a29d1767bc98821fc2bcffc2de53c534e7c719598515bfb600"

      - name: Build exact FFI for iPhone arm64
        shell: bash
        run: |
          set -euxo pipefail
          cd runtime/nedo004-ffi
          cargo build --release --target aarch64-apple-ios
          LIB=target/aarch64-apple-ios/release/libnedo004_ffi.a
          test -s "$LIB"
          file "$LIB"
          lipo -info "$LIB"
          cp "$LIB" "$GITHUB_WORKSPACE/runtime/libnedo004_ffi.a"
          shasum -a 256 "$GITHUB_WORKSPACE/runtime/libnedo004_ffi.a"

      - name: Commit verified iOS static library
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/libnedo004_ffi.a
          git rm .github/workflows/build-nedo004-ios-staticlib.yml
          git commit -m "Add exact Nedo004 iOS static library"
          git push origin HEAD:main

      - name: Start NedoLM IPA workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh workflow run nedolm-ios.yml --ref main
