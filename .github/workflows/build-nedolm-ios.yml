name: Build NedoLM iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-nedolm-ios.yml'
      - 'runtime/**'

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Install Rust iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Checkout Silo
        run: |
          set -euxo pipefail
          git clone https://github.com/stevederico/silo.git silo
          git -C silo checkout 1be4fa9aad0ec72dbb6f40ac07d537ea16648944

      - name: Checkout pinned llama.cpp
        run: |
          set -euxo pipefail
          git clone https://github.com/ggml-org/llama.cpp.git llama.cpp
          git -C llama.cpp checkout e71b80510c848c00175924ecf3c40333ccae8eb5

      - name: Install NedoLM runtime patch
        run: |
          set -euxo pipefail
          cd llama.cpp
          git apply "$GITHUB_WORKSPACE/runtime/nedolm/nedolm-llama.patch"
          cp "$GITHUB_WORKSPACE/runtime/nedolm/nedolm.cpp" src/models/nedolm.cpp
          mkdir -p vendor
          git lfs install
          git clone https://huggingface.co/Ethosoft/NedoTokenizer vendor/NedoTokenizer
          cp -R "$GITHUB_WORKSPACE/runtime/nedo004-ffi" vendor/nedo004-ffi
          ACTUAL="$(shasum -a 256 vendor/NedoTokenizer/assets/surface-vocab.bin | awk '{print $1}')"
          echo "NDSRF004 vocab SHA256: $ACTUAL"
          test "$ACTUAL" = "72412d981dac65a29d1767bc98821fc2bcffc2de53c534e7c719598515bfb600"

      - name: Build exact NDSRF004 FFI for iPhone
        run: |
          set -euxo pipefail
          cd llama.cpp/vendor/nedo004-ffi
          cargo build --release --target aarch64-apple-ios
          mkdir -p target/release
          cp target/aarch64-apple-ios/release/libnedo004_ffi.a target/release/libnedo004_ffi.a
          file target/release/libnedo004_ffi.a

      - name: Patch Apple XCFramework linkage
        run: |
          set -euxo pipefail
          cd llama.cpp
          python3 - <<'PY'
          from pathlib import Path

          cm = Path('src/CMakeLists.txt')
          s = cm.read_text()
          old = 'target_link_libraries(llama PRIVATE nedo004_ffi dl pthread m)'
          if old not in s:
              raise SystemExit('NedoLM FFI CMake linkage anchor not found')
          cm.write_text(s.replace(old, 'target_link_libraries(llama PRIVATE nedo004_ffi)', 1))

          p = Path('build-xcframework.sh')
          s = p.read_text()
          anchor = '        "${base_dir}/${build_dir}/vendor/hash/${release_dir}/libvendor-hash.a"\n'
          if anchor not in s:
              raise SystemExit('XCFramework static library anchor not found')
          extra = '        "${base_dir}/vendor/nedo004-ffi/target/release/libnedo004_ffi.a"\n'
          p.write_text(s.replace(anchor, anchor + extra, 1))
          PY

      - name: Build NedoLM llama XCFramework
        run: |
          set -euxo pipefail
          cd llama.cpp
          chmod +x build-xcframework.sh
          ./build-xcframework.sh ios-device
          test -d build-apple/llama.xcframework

      - name: Install custom llama runtime into Silo
        run: |
          set -euxo pipefail
          rm -rf silo/llama.xcframework
          cp -R llama.cpp/build-apple/llama.xcframework silo/llama.xcframework

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          cd silo
          xcodebuild \
            -project Silo.xcodeproj \
            -scheme Silo \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            build | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail
          APP="$(find "$GITHUB_WORKSPACE/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$APP"
          mkdir -p "$GITHUB_WORKSPACE/package/Payload"
          cp -R "$APP" "$GITHUB_WORKSPACE/package/Payload/"
          cd "$GITHUB_WORKSPACE/package"
          /usr/bin/zip -qry NedoLM-Silo-unsigned.ipa Payload
          shasum -a 256 NedoLM-Silo-unsigned.ipa | tee NedoLM-Silo-unsigned.ipa.sha256
          ls -lh NedoLM-Silo-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NedoLM-Silo-unsigned-IPA
          path: |
            package/NedoLM-Silo-unsigned.ipa
            package/NedoLM-Silo-unsigned.ipa.sha256
            xcodebuild.log
          if-no-files-found: error
          retention-days: 14
