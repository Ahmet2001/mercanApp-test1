name: Build NedoLM iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nedolm-ios.yml"
      - "scripts/**"
      - "runtime/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout mercanApp-test1
        uses: actions/checkout@v4

      - name: Validate NedoLM runtime payload
        shell: bash
        run: |
          set -euo pipefail
          test -s runtime/nedolm-llama.patch || {
            echo "::error::runtime/nedolm-llama.patch eksik"
            exit 2
          }
          test -s runtime/libnedo004_ffi.a || {
            echo "::error::runtime/libnedo004_ffi.a eksik"
            exit 3
          }
          test -s runtime/nedolm/nedolm.cpp || {
            echo "::error::runtime/nedolm/nedolm.cpp eksik"
            exit 4
          }

      - name: Clone Silo
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/stevederico/silo.git work/silo
          cd work/silo
          git checkout 1be4fa9aad0ec72dbb6f40ac07d537ea16648944

      - name: Clone and patch llama.cpp
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/ggml-org/llama.cpp.git work/llama.cpp
          cd work/llama.cpp
          git checkout e71b80510c848c00175924ecf3c40333ccae8eb5
          git apply --check "$GITHUB_WORKSPACE/runtime/nedolm-llama.patch"
          git apply "$GITHUB_WORKSPACE/runtime/nedolm-llama.patch"

          cp "$GITHUB_WORKSPACE/runtime/nedolm/nedolm.cpp" src/models/nedolm.cpp

          mkdir -p vendor/nedo004-ffi/target/release
          cp "$GITHUB_WORKSPACE/runtime/libnedo004_ffi.a" \
             vendor/nedo004-ffi/target/release/libnedo004_ffi.a

          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/CMakeLists.txt')
          s = p.read_text()
          old = 'target_link_libraries(llama PRIVATE nedo004_ffi dl pthread m)'
          if old not in s:
              raise SystemExit('NedoLM FFI CMake linkage anchor not found')
          p.write_text(s.replace(old, 'target_link_libraries(llama PRIVATE nedo004_ffi)', 1))
          PY

      - name: Build NedoLM llama framework for iPhone arm64
        id: llama_build
        shell: bash
        run: |
          set -uo pipefail
          chmod +x scripts/build-nedolm-llama-ios.sh
          set +e
          scripts/build-nedolm-llama-ios.sh \
            "$GITHUB_WORKSPACE/work/llama.cpp" \
            "$GITHUB_WORKSPACE/runtime/libnedo004_ffi.a" \
            "$GITHUB_WORKSPACE/work/nedolm-llama.xcframework" \
            2>&1 | tee "$GITHUB_WORKSPACE/work/llama-framework-build.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Collect llama framework diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p work/diagnostics/llama
          cp work/llama-framework-build.log work/diagnostics/llama/ 2>/dev/null || true
          {
            echo "=== Generated NedoLM XCFramework layout ==="
            find work/nedolm-llama.xcframework -maxdepth 5 -print 2>/dev/null | sort || true
            echo
            echo "=== Generated module maps ==="
            find work/nedolm-llama.xcframework -name module.modulemap -type f -print 2>/dev/null | sort || true
            echo
            echo "=== Generated headers ==="
            find work/nedolm-llama.xcframework -path '*/Headers/*' -type f -print 2>/dev/null | sort || true
            echo
            echo "=== Pinned Silo XCFramework layout ==="
            find work/silo/llama.xcframework -maxdepth 4 -print 2>/dev/null | sort || true
          } > work/diagnostics/llama/framework-layout.txt
          while IFS= read -r map; do
            safe="$(echo "$map" | tr '/ ' '__')"
            cp "$map" "work/diagnostics/llama/${safe}" 2>/dev/null || true
          done < <(find work/nedolm-llama.xcframework work/silo/llama.xcframework -name module.modulemap -type f -print 2>/dev/null)

      - name: Upload llama framework diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NedoLM-Llama-Framework-Diagnostics
          path: work/diagnostics/llama
          if-no-files-found: warn
          retention-days: 3

      - name: Stop on llama framework failure
        if: steps.llama_build.outputs.status != '0'
        shell: bash
        run: |
          echo "::error::NedoLM llama iPhone arm64 framework build failed. See NedoLM-Llama-Framework-Diagnostics."
          exit 1

      - name: Install NedoLM device binary into pinned Silo XCFramework
        shell: bash
        run: |
          set -euo pipefail
          SRC_FW="$GITHUB_WORKSPACE/work/nedolm-llama.xcframework/ios-arm64/llama.framework"
          DST_FW="$GITHUB_WORKSPACE/work/silo/llama.xcframework/ios-arm64/llama.framework"

          test -s "$SRC_FW/llama"
          test -s "$DST_FW/llama"
          test -s "$DST_FW/Info.plist"
          test -s "$DST_FW/Modules/module.modulemap"

          MODULE_SHA_BEFORE="$(shasum -a 256 "$DST_FW/Modules/module.modulemap" | awk '{print $1}')"
          INFO_SHA_BEFORE="$(shasum -a 256 "$DST_FW/Info.plist" | awk '{print $1}')"

          cp "$SRC_FW/llama" "$DST_FW/llama"
          chmod +x "$DST_FW/llama"

          MODULE_SHA_AFTER="$(shasum -a 256 "$DST_FW/Modules/module.modulemap" | awk '{print $1}')"
          INFO_SHA_AFTER="$(shasum -a 256 "$DST_FW/Info.plist" | awk '{print $1}')"
          test "$MODULE_SHA_BEFORE" = "$MODULE_SHA_AFTER"
          test "$INFO_SHA_BEFORE" = "$INFO_SHA_AFTER"

          echo "Pinned Silo modulemap SHA256: $MODULE_SHA_AFTER"
          echo "Pinned Silo framework Info.plist SHA256: $INFO_SHA_AFTER"
          file "$DST_FW/llama"
          lipo -info "$DST_FW/llama"
          otool -L "$DST_FW/llama"

      - name: Repair pinned Silo whisper XCFramework debug-symbol paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          xc = Path('work/silo/whisper.xcframework')
          info_path = xc / 'Info.plist'
          info = plistlib.loads(info_path.read_bytes())
          created = []
          for lib in info.get('AvailableLibraries', []):
              debug_path = lib.get('DebugSymbolsPath')
              identifier = lib.get('LibraryIdentifier')
              if not debug_path or not identifier:
                  continue
              path = xc / identifier / debug_path
              path.mkdir(parents=True, exist_ok=True)
              created.append(str(path))
          if not created:
              raise SystemExit('whisper.xcframework declares no DebugSymbolsPath entries')
          print('Prepared declared whisper debug-symbol paths:')
          print('\n'.join(created))
          PY

      - name: Build unsigned Silo app for device
        id: silo_build
        shell: bash
        run: |
          set -uo pipefail
          cd work/silo
          set +e
          xcodebuild \
            -project Silo.xcodeproj \
            -scheme Silo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/work/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee "$GITHUB_WORKSPACE/work/xcodebuild.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Xcode diagnostics
        if: always() && steps.llama_build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: NedoLM-Xcode-Diagnostics
          path: work/xcodebuild.log
          if-no-files-found: warn
          retention-days: 3

      - name: Stop on Silo build failure
        if: steps.silo_build.outputs.status != '' && steps.silo_build.outputs.status != '0'
        shell: bash
        run: |
          echo "::error::Unsigned Silo iPhone build failed. See NedoLM-Xcode-Diagnostics."
          exit 1

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find work/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          rm -rf work/Payload
          mkdir -p work/Payload
          cp -R "$APP" work/Payload/
          (
            cd work
            /usr/bin/zip -qry NedoLM-Silo-unsigned.ipa Payload
          )
          shasum -a 256 work/NedoLM-Silo-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NedoLM-Silo-unsigned-IPA
          path: work/NedoLM-Silo-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
